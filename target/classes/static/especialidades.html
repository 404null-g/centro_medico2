<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Especialidades · Centro Médico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h1 class="h3 titulo-pagina mb-0"><i class="bi bi-bandaid"></i> Especialidades</h1>
    <button class="btn btn-cm" id="btnNuevo"><i class="bi bi-plus-lg"></i> Nueva especialidad</button>
  </div>
  <div class="card card-cm">
    <div class="card-body">
      <div class="row g-2 mb-3">
        
      </div>
      <div class="tabla-scroll">
        <table class="table table-hover table-cm mb-0">
          <thead><tr><th>Especialidad</th><th>Descripción</th><th>Duración del turno</th><th>Estado</th><th></th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<div class="modal fade" id="modalForm" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="tituloModal"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <form id="form" novalidate>
          <div class="row g-3"><div class="col-md-8"><label class="form-label" for="f-nombre">Nombre <span class="text-danger">*</span></label><input class="form-control" type="text" id="f-nombre" name="nombre" required maxlength="60"><div class="invalid-feedback">Complete este campo correctamente</div></div><div class="col-md-4"><label class="form-label" for="f-duracionTurnoMin">Duración del turno (min) <span class="text-danger">*</span></label><input class="form-control" type="number" id="f-duracionTurnoMin" name="duracionTurnoMin" required min="10" max="120" step="5"><div class="invalid-feedback">Entre 10 y 120 minutos</div><div class="form-text">Define la grilla de horarios</div></div><div class="col-12"><label class="form-label" for="f-descripcion">Descripción</label><input class="form-control" type="text" id="f-descripcion" name="descripcion" maxlength="200"><div class="invalid-feedback">Complete este campo correctamente</div></div><div class="col-12 solo-edicion d-none"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="f-activa" name="activa"><label class="form-check-label" for="f-activa">Especialidad activa</label></div></div></div>
        </form>
        <p class="small text-muted mt-3 mb-0"><span class="text-danger">*</span> Campo obligatorio</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-cm" id="btnGuardar"><i class="bi bi-check-lg"></i> Guardar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
  const sesion = await iniciarPagina(['ADMIN']);
  if (!sesion) return;
  crearABM({
    ruta: '/especialidades', entidad: 'especialidad', columnas: 5, puedeEscribir: true,
    filas: e => `
      <td><strong>${esc(e.nombre)}</strong></td>
      <td>${esc(e.descripcion || '—')}</td>
      <td>${e.duracionTurnoMin} min</td>
      <td>${badgeActivo(e.activa)}</td>`
  });
})();
</script>
</body>
</html>
