<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Centro Médico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center min-vh-100">
<main class="container">
  <div class="login-caja mx-auto">
    <div class="text-center mb-4">
      <i class="bi bi-heart-pulse-fill display-4" style="color: var(--cm-primario)"></i>
      <h1 class="h3 titulo-pagina mt-2 mb-0">Centro Médico</h1>
      <p class="text-muted">Gestión de turnos e historias clínicas</p>
    </div>
    <div class="card card-cm">
      <div class="card-body p-4">
        <form id="formLogin" novalidate>
          <div id="error" class="alert alert-danger py-2 d-none" role="alert"></div>
          <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="username" name="username" required autocomplete="username" autofocus>
            <div class="invalid-feedback">Ingrese su usuario</div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <div class="input-group">
              <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
              <button class="btn btn-outline-secondary" type="button" id="verClave" aria-label="Mostrar u ocultar contraseña"><i class="bi bi-eye"></i></button>
              <div class="invalid-feedback">Ingrese su contraseña</div>
            </div>
          </div>
          <button type="submit" class="btn btn-cm w-100" id="btnIngresar">Ingresar</button>
        </form>
      </div>
    </div>
    <p class="text-center small text-muted mt-3">¿Olvidó su contraseña? Solicite el cambio a Administración.</p>
  </div>
</main>
<script>
  const form = document.getElementById('formLogin');
  const error = document.getElementById('error');

  // Si ya hay una sesión abierta, ir directo al inicio
  fetch('/api/auth/me', { credentials: 'same-origin' }).then(r => { if (r.ok) location.href = 'index.html'; });

  document.getElementById('verClave').addEventListener('click', () => {
    const p = document.getElementById('password');
    p.type = p.type === 'password' ? 'text' : 'password';
  });

  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    error.classList.add('d-none');
    if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
    const boton = document.getElementById('btnIngresar');
    boton.disabled = true;
    boton.textContent = 'Ingresando…';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(new FormData(form))
      });
      if (res.ok) { location.href = 'index.html'; return; }
      const datos = await res.json().catch(() => ({}));
      error.textContent = datos.mensaje || 'No se pudo iniciar sesión';
    } catch (e) {
      error.textContent = 'No hay conexión con el servidor';
    }
    error.classList.remove('d-none');
    boton.disabled = false;
    boton.textContent = 'Ingresar';
  });
</script>
</body>
</html>
